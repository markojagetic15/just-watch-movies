<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 224 50" width="224" height="50" aria-label="JustWatch Movies">
  <!-- outer glow -->
  <circle cx="25" cy="25" r="24" fill="#FBC500" fill-opacity="0.07"/>
  <!-- mid ring -->
  <circle cx="25" cy="25" r="19" fill="#FBC500" fill-opacity="0.18"/>
  <!-- main circle -->
  <circle cx="25" cy="25" r="14" fill="#FBC500"/>
  <!-- play triangle -->
  <polygon points="22,18 22,32 34,25" fill="#060E17"/>

  <!-- JUST - small, light, cyan-gray -->
  <text x="58" y="20" font-family="Poppins, sans-serif" font-size="9" font-weight="300" fill="#78A6B8" letter-spacing="4.5">JUST</text>

  <!-- WATCH - large, bold, white -->
  <text x="56" y="43" font-family="Poppins, sans-serif" font-size="23" font-weight="700" fill="white">WATCH</text>

  <!-- vertical divider -->
  <line x1="150" y1="30" x2="150" y2="46" stroke="#FBC500" stroke-width="1" stroke-opacity="0.45"/>

  <!-- movies - small, gold -->
  <text x="158" y="43" font-family="Poppins, sans-serif" font-size="10" font-weight="500" fill="#FBC500" letter-spacing="2">movies</text>
</svg>
